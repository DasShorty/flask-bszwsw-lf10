{% extends "base.html" %}

{% block title %}Benutzer{% endblock %}

{% block content %}
    <h1 class="mb-4">Benutzer</h1>

    {% if users %}
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>E-Mail</th></tr>
            </thead>
            <tbody>
            {% for u in users %}
                <tr><td>{{ u.name }}</td><td>{{ u.email }}</td></tr>
            {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-info">Noch keine Benutzer vorhanden.</div>
    {% endif %}

    <h2 class="mt-5">Neuer Benutzer</h2>
    <form method="post" action="{{ url_for('users.create_user') }}" class="col-md-5">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" name="name" class="form-control" required maxlength="100">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-Mail</label>
            <input id="email" name="email" type="email" class="form-control" required maxlength="255">
        </div>
        <button type="submit" class="btn btn-primary">Benutzer anlegen</button>
    </form>
{% endblock %}
